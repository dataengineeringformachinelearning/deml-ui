name: Chromatic

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: chromatic-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromatic:
    name: Visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Requires CHROMATIC_PROJECT_TOKEN in repo secrets.
    # Without it the job fails closed so snapshots cannot silently skip.
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: NFTS style gate
        run: npm run check:nfts

      - name: Story coverage gate
        run: npm run check:stories

      - name: Require Chromatic project token
        env:
          CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
        run: |
          if [ -z "$CHROMATIC_PROJECT_TOKEN" ]; then
            echo "::error::Set repository secret CHROMATIC_PROJECT_TOKEN (Chromatic → Project → Manage)."
            exit 1
          fi

      - name: Publish to Chromatic
        uses: chromaui/action@latest
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          buildScriptName: build-storybook
          onlyChanged: true
          exitOnceUploaded: true
          zip: true
        env:
          CHROMATIC: "1"
          CI: "true"
