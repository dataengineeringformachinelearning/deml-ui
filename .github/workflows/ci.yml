name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Sync · package · Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: NFTS style gate (warm ash)
        run: npm run check:nfts

      - name: Story coverage gate
        run: npm run check:stories

      - name: Sync generators
        run: npm run sync

      - name: Build library (styles + web components + html + angular)
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook
        env:
          CI: "true"

      - name: Upload Storybook artifact
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 7

      - name: Upload package dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
