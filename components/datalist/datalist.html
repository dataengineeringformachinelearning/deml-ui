<section id="datalist" class="component component--datalist form-field">
  <h2>Datalist</h2>
  <div class="demo">
    <label for="datalist-field">Browser</label>
    <input id="datalist-field" name="browser" list="browsers-list" placeholder="Pick or type">
    <datalist id="browsers-list">
      <option value="Chrome"></option>
      <option value="Firefox"></option>
      <option value="Safari"></option>
      <option value="Edge"></option>
    </datalist>
  </div>
</section>
