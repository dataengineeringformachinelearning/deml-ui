<section id="document">
  <h2>Document &amp; sectioning</h2>
  <div class="demo layout-aside">

      <header>
        <h3>Article title</h3>
        <p><time datetime="2026-07-25">July 25, 2026</time></p>
      </header>
      <p>This <code>&lt;article&gt;</code> lives inside <code>&lt;main&gt;</code>, with a <code>&lt;header&gt;</code> and <code>&lt;footer&gt;</code>.</p>

        <address>

    </form>
  </search>
