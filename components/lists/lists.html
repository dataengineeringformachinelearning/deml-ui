<section id="lists">
  <h2>Lists</h2>
  <div class="demo">
    <h3>Unordered</h3>
    <ul>
      <li>List item 1</li>
      <li>List item 2
        <ul>
          <li>Nested item</li>
        </ul>
      </li>
      <li>List item 3</li>
    </ul>

    <h3>Ordered</h3>
    <ol>
      <li>First</li>
      <li>Second</li>
      <li>Third</li>
    </ol>

    <h3>Description</h3>
    <dl>
      <dt>Term</dt>
      <dd>Definition of the term.</dd>
      <dt>Another term</dt>
      <dd>Another definition.</dd>
    </dl>

    <h3>Menu</h3>
    <menu>
      <li><button type="button">Cut</button></li>
      <li><button type="button">Copy</button></li>
      <li><button type="button">Paste</button></li>
    </menu>
  </div>
</section>
