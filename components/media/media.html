<!--
  Component: Media & embedded content
  Path: components/media/media.html
  Styles: components/media/media.css
-->
<section id="media">
  <h2>Media &amp; embedded content</h2>

  <div class="demo">
    <h3>Image</h3>
    <figure>
      <img
        src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
        alt="Google logo"
        width="272"
        height="92">
      <figcaption>An image inside a figure with a caption.</figcaption>
    </figure>
  </div>

  <div class="demo">
    <h3>Picture / source</h3>
    <picture>
      <source
        media="(min-width: 600px)"
        srcset="https://www.google.com/images/branding/googlelogo/2x/googlelogo_color_272x92dp.png">
      <img
        src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
        alt="Responsive Google logo">
    </picture>
  </div>

  <div class="demo">
    <h3>Image map</h3>
    <img
      src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
      alt="Clickable regions"
      usemap="#logo-map"
      width="272"
      height="92">
    <map name="logo-map">
      <area
        shape="rect"
        coords="0,0,136,92"
        href="https://www.google.com"
        alt="Left half">
      <area
        shape="rect"
        coords="136,0,272,92"
        href="https://developer.mozilla.org"
        alt="Right half">
    </map>
  </div>

  <div class="demo">
    <h3>Audio</h3>
    <audio controls preload="none">
      <source src="https://www.w3schools.com/html/horse.mp3" type="audio/mpeg">
      <track kind="captions" src="" srclang="en" label="English">
      Your browser does not support the audio element.
    </audio>
  </div>

  <div class="demo">
    <h3>Video</h3>
    <video controls width="320" height="180" preload="metadata" poster="">
      <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
      <track kind="captions" src="" srclang="en" label="English">
      Your browser does not support the video element.
    </video>
  </div>

  <div class="demo">
    <h3>Iframe</h3>
    <iframe
      title="Example embed"
      src="https://example.com"
      width="100%"
      height="160"
      loading="lazy"></iframe>
  </div>

  <div class="demo">
    <h3>Embed &amp; object</h3>
    <embed
      src="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
      type="application/pdf"
      width="100%"
      height="160">
    <object
      data="https://www.w3.org/WAI/ER/tests/xhtml/testfiles/resources/pdf/dummy.pdf"
      type="application/pdf"
      width="100%"
      height="160">
      Fallback content for object.
    </object>
  </div>

  <div class="demo">
    <h3>SVG</h3>
    <svg width="120" height="80" viewBox="0 0 120 80" role="img" aria-label="Blue rectangle">
      <rect x="10" y="10" width="100" height="60" fill="#0b5fff" rx="6"></rect>
      <text x="60" y="46" text-anchor="middle" fill="white" font-size="14" font-family="sans-serif">SVG</text>
    </svg>
  </div>

  <div class="demo">
    <h3>Canvas</h3>
    <canvas id="demo-canvas" width="200" height="100" aria-label="Canvas demo"></canvas>
  </div>

  <div class="demo">
    <h3>Math (MathML)</h3>
    <math display="block">
      <mrow>
        <mi>a</mi>
        <mo>²</mo>
        <mo>+</mo>
        <mi>b</mi>
        <mo>²</mo>
        <mo>=</mo>
        <mi>c</mi>
        <mo>²</mo>
      </mrow>
    </math>
  </div>
</section>
