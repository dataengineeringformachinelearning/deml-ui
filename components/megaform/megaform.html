<!--
  Component: Megaform
  Path: components/megaform/megaform.html
  Styles: components/megaform/megaform.css
-->
<section id="megaform" class="component component--megaform form-field">
  <h2>Megaform</h2>
  <div class="demo">
    <form action="#" method="post" enctype="multipart/form-data">
      <fieldset>
        <legend>Account</legend>
        <label for="mega-name">Name</label>
        <input id="mega-name" name="name" type="text" placeholder="Name" autocomplete="name" required>
        <label for="mega-email">Email</label>
        <input id="mega-email" name="email" type="email" placeholder="you@example.com" autocomplete="email">
        <label for="mega-password">Password</label>
        <input id="mega-password" name="password" type="password" placeholder="Password" autocomplete="new-password">
        <label for="mega-tel">Phone</label>
        <input id="mega-tel" name="tel" type="tel" placeholder="+1 555 0100">
        <label for="mega-url">Website</label>
        <input id="mega-url" name="url" type="url" placeholder="https://example.com">
        <label for="mega-search">Search</label>
        <input id="mega-search" name="search" type="search" placeholder="Search…">
      </fieldset>
      <fieldset>
        <legend>Numbers &amp; ranges</legend>
        <label for="mega-number">Number</label>
        <input id="mega-number" name="number" type="number" min="0" max="100" step="1" value="10">
        <label for="mega-range">Range</label>
        <input id="mega-range" name="range" type="range" min="0" max="100" value="40">
        <label for="mega-color">Color</label>
        <input id="mega-color" name="color" type="color" value="#5C2A5A">
      </fieldset>
      <fieldset>
        <legend>Dates &amp; time</legend>
        <label for="mega-date">Date</label>
        <input id="mega-date" name="date" type="date">
        <label for="mega-time">Time</label>
        <input id="mega-time" name="time" type="time">
        <label for="mega-datetime-local">Datetime local</label>
        <input id="mega-datetime-local" name="datetime-local" type="datetime-local">
        <label for="mega-month">Month</label>
        <input id="mega-month" name="month" type="month">
        <label for="mega-week">Week</label>
        <input id="mega-week" name="week" type="week">
      </fieldset>
      <fieldset>
        <legend>Choices</legend>
        <label><input type="checkbox" name="features" value="news"> Newsletter</label>
        <label><input type="checkbox" name="features" value="updates" checked> Updates</label>
        <label><input type="radio" name="plan" value="free" checked> Free</label>
        <label><input type="radio" name="plan" value="pro"> Pro</label>
        <label><input type="radio" name="plan" value="team"> Team</label>
      </fieldset>
      <fieldset>
        <legend>Select &amp; datalist</legend>
        <label for="mega-country">Country</label>
        <select id="mega-country" name="country">
          <optgroup label="Americas">
            <option value="us">United States</option>
            <option value="ca">Canada</option>
          </optgroup>
          <optgroup label="Europe">
            <option value="uk">United Kingdom</option>
            <option value="de">Germany</option>
          </optgroup>
        </select>
        <label for="mega-browser">Browser</label>
        <input id="mega-browser" name="browser" list="mega-browsers" placeholder="Pick or type">
        <datalist id="mega-browsers">
          <option value="Chrome"></option>
          <option value="Firefox"></option>
          <option value="Safari"></option>
          <option value="Edge"></option>
        </datalist>
      </fieldset>
      <fieldset>
        <legend>Files &amp; hidden</legend>
        <label for="mega-file">File</label>
        <input id="mega-file" name="file" type="file" accept="image/*,.pdf">
        <input type="hidden" name="csrf" value="demo-token">
        <input type="image" src="https://www.google.com/images/branding/googleg/1x/googleg_standard_color_128dp.png" alt="Image submit" width="32" height="32">
      </fieldset>
      <fieldset>
        <legend>Message</legend>
        <label for="mega-message">Textarea</label>
        <textarea id="mega-message" name="message" rows="4" cols="40" placeholder="Message"></textarea>
      </fieldset>
      <fieldset>
        <legend>Output controls</legend>
        <label for="mega-a">A</label>
        <input id="mega-a" type="number" value="2">
        <label for="mega-b">B</label>
        <input id="mega-b" type="number" value="3">
        <output id="mega-sum" name="sum" for="mega-a mega-b">5</output>
        <label for="mega-progress">Progress</label>
        <progress id="mega-progress" value="70" max="100">70%</progress>
        <label for="mega-meter">Meter</label>
        <meter id="mega-meter" min="0" max="100" low="30" high="70" optimum="80" value="65">65</meter>
      </fieldset>
      <p>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        <button type="button">Button</button>
        <input type="submit" value="Input submit">
        <input type="reset" value="Input reset">
        <input type="button" value="Input button">
      </p>
    </form>
  </div>
</section>
