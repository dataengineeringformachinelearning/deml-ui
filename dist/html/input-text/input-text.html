<section id="input-text" class="component component--input-text">
  <h2>Text input</h2>
  <div class="demo">
    <label class="text-field" for="input-text-field">
      <span class="text-field__label">Name</span>

        id="input-text-field"
        class="text-field__control"
        name="name"

        placeholder="Your name"

  </div>
</section>
