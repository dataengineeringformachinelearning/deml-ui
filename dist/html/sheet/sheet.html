<!--
  Component: Sheet
  Path: components/sheet/sheet.html
  Styles: components/sheet/sheet.css

  Catalog preview only — product sheets (deml app-sheet) own focus trap,
  Escape, inert chrome, and restore-focus. See docs/ACCESSIBILITY.md.
-->
<section id="sheet" class="component component--sheet">
  <h2>Sheet</h2>
  <div class="demo">
    <div class="sheet-overlay" role="presentation">
      <div
        class="sheet"
        role="dialog"
        aria-modal="true"
        aria-labelledby="sheet-title"
        aria-describedby="sheet-desc"
        tabindex="-1"
      >
        <button type="button" class="sheet__handle" aria-label="Dismiss"></button>
        <header class="sheet__header">
          <h3 class="sheet__title" id="sheet-title">Confirm action</h3>
        </header>
        <div class="sheet__body">
          <p id="sheet-desc">Bottom sheet on phone; centered panel from 800px.</p>
        </div>
        <footer class="sheet__footer">
          <button type="button" class="button button--secondary button--pill">Cancel</button>
          <button type="button" class="button button--primary button--pill">Confirm</button>
        </footer>
      </div>
    </div>
  </div>
</section>
