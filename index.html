<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="deml-ui — new-from-the-start (warm ash) component library">
  <meta name="theme-color" content="#35312D">
  <title>deml-ui — Component reference</title>
  <base href="./">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>D</text></svg>">
  <link rel="stylesheet" href="node_modules/@fontsource-variable/geist/wght.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components/components.css">
</head>
<body>
  <div data-include="components/skip-link/skip-link.html"></div>
  <div data-include="components/navbar/navbar.html"></div>

  <main id="main" class="page-shell">
    <div class="page-shell__inner">
      <header class="page-header">
        <div class="page-header__text">
          <h1 class="page-header__title">deml-ui</h1>
          <p class="page-header__subtitle">new-from-the-start (warm ash) — HTML/CSS sources, Web Components, and Angular. Prefer Storybook for the full catalog.</p>
        </div>
        <div class="page-header__actions">
          <a class="button button--primary" href="/storybook/">Open Storybook</a>
        </div>
      </header>

      <section class="section">
        <header class="section__header">
          <h2 class="section__title">Shell</h2>
          <p class="section__description">App chrome and page anatomy.</p>
        </header>
        <div data-include="components/app-layout/app-layout.html"></div>
        <div data-include="components/page-header/page-header.html"></div>
        <div data-include="components/toc/toc.html"></div>
      </section>

      <section class="section">
        <header class="section__header">
          <h2 class="section__title">Data</h2>
          <p class="section__description">Surfaces you compose into dashboards.</p>
        </header>
        <div class="panel-grid">
          <div data-include="components/stat-card/stat-card.html"></div>
          <div data-include="components/card/card.html"></div>
        </div>
        <div data-include="components/table/table.html"></div>
        <div data-include="components/chart-panel/chart-panel.html"></div>
      </section>

      <section class="section">
        <header class="section__header">
          <h2 class="section__title">Forms & feedback</h2>
        </header>
        <div data-include="components/field/field.html"></div>
        <div data-include="components/button/button.html"></div>
        <div data-include="components/callout/callout.html"></div>
        <div data-include="components/sheet/sheet.html"></div>
        <div data-include="components/dialog/dialog.html"></div>
      </section>
    </div>
  </main>

  <div data-include="components/site-footer/site-footer.html"></div>
  <script type="module" src="components/load.js"></script>
</body>
</html>
