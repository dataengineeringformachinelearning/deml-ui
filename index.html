<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="HTML element reference — every common HTML component in one page.">
  <meta name="keywords" content="html, elements, reference, components">
  <meta name="author" content="deml">
  <meta name="theme-color" content="#1a1a1a">
  <title>HTML Element Reference</title>
  <base href="./">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='14' font-size='14'>H</text></svg>">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="components/components.css">
</head>
<body>
  <!--
    Page composition — each block is a component fragment.
    Convention: components/<name>/<name>.html + <name>.css
    Serve over HTTP so data-include can fetch (e.g. npx serve).
  -->
  <div data-include="components/skip-link/skip-link.html"></div>
  <div data-include="components/site-header/site-header.html"></div>
  <div data-include="components/navbar/navbar.html"></div>

  <main id="main">
    <div data-include="components/gallery/gallery.html"></div>

    <div data-include="components/article/article.html"></div>
    <div data-include="components/aside/aside.html"></div>
    <div data-include="components/search/search.html"></div>

    <div data-include="components/headings/headings.html"></div>

    <div data-include="components/paragraph/paragraph.html"></div>
    <div data-include="components/bidirectional/bidirectional.html"></div>
    <div data-include="components/blockquote/blockquote.html"></div>
    <div data-include="components/pre/pre.html"></div>
    <div data-include="components/edits/edits.html"></div>
    <div data-include="components/ruby/ruby.html"></div>

    <div data-include="components/unordered-list/unordered-list.html"></div>
    <div data-include="components/ordered-list/ordered-list.html"></div>
    <div data-include="components/description-list/description-list.html"></div>
    <div data-include="components/menu/menu.html"></div>

    <div data-include="components/table/table.html"></div>

    <div data-include="components/image/image.html"></div>
    <div data-include="components/picture/picture.html"></div>
    <div data-include="components/image-map/image-map.html"></div>
    <div data-include="components/audio/audio.html"></div>
    <div data-include="components/video/video.html"></div>
    <div data-include="components/iframe/iframe.html"></div>
    <div data-include="components/embed-object/embed-object.html"></div>
    <div data-include="components/svg/svg.html"></div>
    <div data-include="components/canvas/canvas.html"></div>
    <div data-include="components/math/math.html"></div>

    <div data-include="components/forms/forms.html"></div>

    <div data-include="components/details/details.html"></div>
    <div data-include="components/dialog/dialog.html"></div>

    <div data-include="components/noscript/noscript.html"></div>
    <div data-include="components/template/template.html"></div>
    <div data-include="components/slot/slot.html"></div>
  </main>

  <div data-include="components/site-footer/site-footer.html"></div>

  <script src="components/demos.js"></script>
  <script src="components/load.js"></script>
</body>
</html>
